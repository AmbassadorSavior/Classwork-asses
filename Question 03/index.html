<!DOCTYPE html>
<html>
<head>
    <title>Number Analysis System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Number Analysis System</h2>

    <p>Enter 15 numbers separated by commas.</p>

    <form id="numberForm">

        <label>Enter Numbers:</label>
        <textarea id="numbers" placeholder="Example: 10, 15, 20, 25..." required></textarea>

        <button type="submit">Analyze Numbers</button>

    </form>

    <div id="result"></div>

    <script src="index.js"></script>

</body>
</html>
