<!DOCTYPE html>
<html>
<head>
    <title>Employee Data Processing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h2>Employee Data Processing System</h2>

        <h3>All Employees</h3>
        <div id="employees"></div>

        <h3>Search by Department</h3>
        <input type="text" id="department" placeholder="Enter department">
        <button onclick="searchDepartment()">Search</button>
        <div id="departmentResult"></div>

        <h3>Employees Earning Above ₦200,000</h3>
        <button onclick="highEarners()">View Employees</button>
        <div id="highEarners"></div>

        <h3>Average Salary</h3>
        <button onclick="averageSalary()">Calculate Average</button>
        <p id="average"></p>

        <h3>Highest Paid Employee</h3>
        <button onclick="highestSalary()">Find Employee</button>
        <p id="highest"></p>

        <h3>Employee Names</h3>
        <button onclick="employeeNames()">View Names</button>
        <div id="names"></div>

    </div>

    <script src="index.js"></script>

</body>
</html>
