<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Student Management System</h2>

    <h3>Add Student</h3>

    <form id="studentForm">

        <label>Student ID:</label>
        <input type="text" id="studentId" required>

        <label>Full Name:</label>
        <input type="text" id="fullName" required>

        <label>Email Address:</label>
        <input type="email" id="email" required>

        <label>Age:</label>
        <input type="number" id="age" min="1" required>

        <label>Course:</label>
        <input type="text" id="course" required>

        <button type="submit" id="submitButton">Add Student</button>
        <button type="button" id="cancelButton" hidden>Cancel Edit</button>

    </form>

    <hr>

    <h3>Search Student</h3>

    <input type="text" id="searchId" placeholder="Enter student ID">
    <button type="button" id="searchButton">Search</button>
    <button type="button" id="showAllButton">Show All Students</button>

    <p id="message"></p>

    <h3>Registered Students</h3>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="studentList"></tbody>
    </table>

    <script src="index.js"></script>

</body>
</html>
